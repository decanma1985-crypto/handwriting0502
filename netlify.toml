[build]
  command = "npm run build"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin.js"
  to = "/admin.js"
  status = 200
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin.html"
  to = "/login.html"
  status = 302
  force = true

[[redirects]]
  from = "/admin.js"
  to = "/login.html"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
